<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout | Northbeam Supply (Vue)</title>
    <!--
      A Vue 3 build of the demo page, so the component lookup has a real Vue
      instance tree to read.

          python3 -m http.server 8000
          open http://localhost:8000/tools/panel-stage.html?demo=demo-vue.html

      The development bundle is not a convenience here, it is the whole point.
      Vue attaches __vueParentComponent to a rendered element only when __DEV__
      is on (or the devtools feature flag is compiled in), so a production
      bundle would leave the lookup with nothing to find. The full bundle, not
      the runtime only one, because these components carry `template` strings
      and there is no build step to compile them ahead of time.

      What this fixture proves. Picking an element reaches a genuine component
      instance, so the walk up the parent chain, the component names, the props
      and the development flag can all be checked.

      Source paths. Vue's SFC compiler is what normally sets Component.__file,
      and there is no SFC compiler here, so CouponField and OrderTotal set it
      by hand and every other component leaves it undefined. That is not
      artificial: a component written as a plain object, as all of these are,
      genuinely has no __file, so both branches of the lookup are real.

      Nothing under tools/ ships (see INCLUDE in tools/build.mjs), which is why
      loading Vue from a CDN is acceptable here and would not be acceptable
      anywhere in the extension.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.5.43/vue.global.js"></script>
    <style>
      :root {
        --ink: #16171b;
        --dim: #6b7280;
        --line: #e5e7eb;
        --brand: #2f6f4e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f4f5f7;
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo { font-weight: 700; letter-spacing: -0.02em; font-size: 17px; }
      .logo span { color: var(--brand); }
      nav { color: var(--dim); font-size: 13px; display: flex; gap: 22px; }
      main {
        max-width: 940px;
        margin: 32px auto;
        padding: 0 24px;
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 28px;
        align-items: start;
      }
      h1 { font-size: 22px; margin: 0 0 18px; letter-spacing: -0.02em; }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
      }
      .line-item {
        display: flex;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .line-item:last-child { border-bottom: 0; }
      .thumb {
        width: 56px; height: 56px; border-radius: 7px; flex: none;
        background: linear-gradient(135deg, #dfe4ea, #c7ced8);
      }
      .item-name { font-weight: 600; font-size: 14px; }
      .item-meta { color: var(--dim); font-size: 12.5px; }
      .item-price { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 14px; }

      .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 7px 0;
        font-size: 14px;
        color: var(--dim);
      }
      .summary-row.total {
        border-top: 1px solid var(--line);
        margin-top: 10px;
        padding-top: 13px;
        color: var(--ink);
        font-weight: 700;
        font-size: 17px;
      }
      .total .amount { font-variant-numeric: tabular-nums; }

      .coupon { display: flex; gap: 8px; margin: 16px 0 4px; }
      .coupon input {
        flex: 1; min-width: 0; padding: 9px 11px; font: inherit; font-size: 13.5px;
        border: 1px solid var(--line); border-radius: 7px;
      }
      button {
        font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
        border: 0; border-radius: 7px; padding: 9px 15px;
        background: var(--brand); color: #fff;
      }
      button.secondary { background: #eef0f3; color: var(--ink); }
      .pay { width: 100%; margin-top: 16px; padding: 13px; font-size: 15px; }
      .hint {
        margin: 22px auto 40px; max-width: 940px; padding: 0 24px;
        font-size: 13px; color: var(--dim);
      }
      .hint code {
        background: #e9ebef; padding: 1px 5px; border-radius: 4px;
        font: 12px ui-monospace, Menlo, monospace;
      }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (() => {
        'use strict';

        const CATALOG = { WINTER10: { rate: 0.1 } };

        const ITEMS = [
          { id: 'jacket', name: 'Trail Shell Jacket', meta: 'Slate, size M', price: 189, inStock: true, tags: ['outerwear', 'waterproof'] },
          { id: 'base', name: 'Merino Base Layer', meta: 'Charcoal, size M', price: 74, inStock: true, tags: ['wool'] },
          { id: 'drybag', name: 'Dry Bag, 12L', meta: 'Yellow', price: 32, inStock: false, tags: ['packing', 'clearance'] },
        ];

        const money = (amount) => `$${amount.toFixed(2)}`;

        const LineItem = {
          name: 'LineItem',
          props: {
            name: { type: String, required: true },
            meta: { type: String, default: '' },
            price: { type: Number, required: true },
            inStock: { type: Boolean, default: true },
            tags: { type: Array, default: () => [] },
          },
          methods: { money },
          template: `
            <div class="line-item" :title="tags.join(', ')">
              <div class="thumb"></div>
              <div>
                <div class="item-name">{{ name }}</div>
                <div class="item-meta">{{ inStock ? meta : meta + ', backordered' }}</div>
              </div>
              <div class="item-price">{{ money(price) }}</div>
            </div>
          `,
        };

        const OrderList = {
          name: 'OrderList',
          components: { LineItem },
          props: { items: { type: Array, default: () => [] } },
          template: `
            <section>
              <h1>Your order</h1>
              <div class="card">
                <LineItem
                  v-for="item in items"
                  :key="item.id"
                  :name="item.name"
                  :meta="item.meta"
                  :price="item.price"
                  :in-stock="item.inStock"
                  :tags="item.tags"
                />
              </div>
            </section>
          `,
        };

        const SummaryRow = {
          name: 'SummaryRow',
          props: {
            label: { type: String, required: true },
            value: { type: String, required: true },
          },
          template: `
            <div class="summary-row"><span>{{ label }}</span><span>{{ value }}</span></div>
          `,
        };

        const OrderTotal = {
          name: 'OrderTotal',
          props: {
            label: { type: String, default: 'Total' },
            amount: { type: Number, required: true },
            pending: { type: Boolean, default: false },
            breakdown: { type: Array, default: () => [] },
            recalculate: { type: Function, default: null },
          },
          methods: { money },
          template: `
            <div
              class="summary-row total"
              data-total
              :title="breakdown.join(' + ')"
              @dblclick="recalculate && recalculate()"
            >
              <span>{{ label }}</span>
              <span
                id="total"
                class="amount total-amount"
                :style="pending ? { opacity: 0.55 } : null"
              >{{ money(amount) }}</span>
            </div>
          `,
        };
        OrderTotal.__file = 'src/components/cart/OrderTotal.vue';

        const CouponField = {
          name: 'CouponField',
          props: {
            code: { type: String, default: '' },
            busy: { type: Boolean, default: false },
          },
          emits: ['update:code', 'apply'],
          template: `
            <div class="coupon">
              <input
                id="coupon"
                placeholder="Coupon code"
                :value="code"
                @input="$emit('update:code', $event.target.value)"
              />
              <button class="secondary" id="apply" :disabled="busy" @click="$emit('apply')">
                Apply
              </button>
            </div>
          `,
        };
        CouponField.__file = 'src/components/cart/CouponField.vue';

        const CartSummary = {
          name: 'CartSummary',
          components: { SummaryRow, OrderTotal, CouponField },
          props: {
            subtotal: { type: Number, required: true },
            shipping: { type: Number, required: true },
          },
          data() {
            return {
              code: 'SUMMER25',
              discount: null,
              total: this.subtotal + this.shipping,
              pending: false,
            };
          },
          methods: {
            money,

            async applyCoupon(entered) {
              const response = await fetch('/api/coupons/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: entered }),
              });

              if (!response.ok) {
                console.warn(`Coupon ${entered} not found in catalog, falling back to local lookup`);
              }

              const entry = CATALOG[entered];
              // The same bug the plain demo page has: `entry` is undefined for
              // any code outside CATALOG, so reading .rate throws and the total
              // is left holding NaN.
              const amount = this.subtotal * entry.rate;

              this.discount = amount;
              this.total = this.subtotal + this.shipping - amount;
              this.pending = false;
            },

            onApply() {
              this.pending = true;
              this.total = NaN;
              // The promise is dropped on purpose. Vue runs event handlers
              // through callWithAsyncErrorHandling, so a handler that returns
              // its promise hands the rejection to Vue, which relabels it
              // through its own warn and rethrows it from inside a catch.
              // Dropping it leaves a plain unhandled rejection carrying the
              // TypeError, which is what the plain demo page produces and what
              // the collector should report.
              this.applyCoupon(this.code.trim());
            },

            reset() {
              this.discount = null;
              this.pending = false;
              this.total = this.subtotal + this.shipping;
            },
          },
          template: `
            <aside class="card cart-summary">
              <SummaryRow label="Subtotal" :value="money(subtotal)" />
              <SummaryRow label="Shipping" :value="money(shipping)" />
              <SummaryRow
                v-if="discount !== null"
                label="Discount"
                :value="'−' + money(discount)"
              />
              <OrderTotal
                label="Total"
                :amount="total"
                :pending="pending"
                :breakdown="['subtotal', 'shipping', 'discount']"
                :recalculate="reset"
              />
              <CouponField
                :code="code"
                :busy="pending"
                @update:code="code = $event"
                @apply="onApply"
              />
              <button class="pay">Pay {{ money(total) }}</button>
            </aside>
          `,
        };

        const CheckoutPage = {
          name: 'CheckoutPage',
          components: { OrderList, CartSummary },
          data() {
            return { items: ITEMS };
          },
          template: `
            <main>
              <OrderList :items="items" />
              <CartSummary :subtotal="295" :shipping="9" />
            </main>
          `,
        };

        const App = {
          name: 'App',
          components: { CheckoutPage },
          template: `
            <header>
              <div class="logo">Northbeam<span>.</span></div>
              <nav><span>Shop</span><span>Orders</span><span>Account</span></nav>
            </header>

            <CheckoutPage />

            <p class="hint">
              Vue fixture for Punch List. Click <code>Apply</code> for the same bug the plain
              demo page has: a failing request, a console warning, and an uncaught TypeError
              that leaves <code>NaN</code> in the total. Pick the total, the coupon field or a
              line item to exercise the component lookup.
            </p>
          `,
        };

        Vue.createApp(App).mount('#app');
      })();
    </script>
  </body>
</html>
